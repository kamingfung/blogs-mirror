# Earth Data in Python and R — syllabus. Source of truth for nav order, levels and prerequisites.
# A module with `path` exists. `split_from` means it is still inside that longer post.
# Anything with neither is a gap: listed on What's next, never in the nav.

title: "Earth Data in Python and R"
slug: earth-data
order: 8
about: "The tools for gridded, vector and image data in the Earth sciences, and how to plot the result without lying."
