# How clouds form — syllabus. Source of truth for nav order, levels and prerequisites.
# A module with `path` exists. Anything without one is a gap: listed on
# What's next, never in the nav. Module ids are permanent.
title: How clouds form
slug: cloud-formation
order: 1
about: 'Water vapour to raindrop: what has to happen, in order, and why each step needs the one before it.'
assumes: School physics. A little calculus appears in the droplet parts and is always optional.
