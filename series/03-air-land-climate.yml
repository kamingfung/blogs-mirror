# Air, Land and Climate — syllabus. Source of truth for nav order, levels and prerequisites.
# A module with `path` exists. `split_from` means it is still inside that longer post.
# Anything with neither is a gap: listed on What's next, never in the nav.

title: "Air, Land and Climate"
