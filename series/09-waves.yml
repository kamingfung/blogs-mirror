# Waves, Sound and Imaging — syllabus. Source of truth for nav order, levels and prerequisites.
# A module with `path` exists. `split_from` means it is still inside that longer post.
# Anything with neither is a gap: listed on What's next, never in the nav.
title: Waves, Sound and Imaging
slug: waves
order: 9
about: One idea, the wave, followed from a plucked string through Fourier analysis to a brain scan.
assumes: School physics and trigonometry.
